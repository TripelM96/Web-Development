<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex2_JS</title>
</head>

<body>
    <script>
        let frase = "Exemplo de uma frase com palavras";
        let fraseArray = frase.split(" ");
        // console.log(fraseArray);
        
        let stringSize = "";

        for (let i = 0; i < fraseArray.length; i++) 
        {
            if(fraseArray[i].length > stringSize.length)
            {
                stringSize=fraseArray[i];
            }            
        }
        console.log(` ${stringSize} - ${stringSize.length} palavras`);


    </script>
</body>

</html>
