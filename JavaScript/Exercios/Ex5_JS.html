<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
            // [^...] → negação(remove tudo que não estiver dentro).
            // a - z → letras minúsculas.
            // A - Z → letras maiúsculas.
            // \s → espaço(whitespace).
            // g → global(aplica a toda a string).

        let texto = "Olá! 123 @Teste# com símbolos.";
        let limpo = texto.replace(/[^a-zA-Z\s]/g, "");
        console.log(limpo);
        
    </script>
</body>

</html>
