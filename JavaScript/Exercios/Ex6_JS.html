<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex6_JS</title>
</head>
<body>
    <script>
        let ano=13;
        if(ano % 4 == 0)
        {
            if(ano % 100 == 0)
            {
                if(ano % 400 == 0)
                {
                    console.log("Leap Year");

                }
                else
                {
                    console.log("Not Leap Year");
                }
            }
            else
            {
                console.log("Leap Year");
            }
        }
        else
        {
            console.log("Not Leap Year");
        }
    </script>
</body>
</html>
